services:
  postgres:
    image: postgres:16-alpine
    environment:
      # files/config/config.yaml 의 database.user / database.name 과 일치해야 한다.
      POSTGRES_USER: admin
      POSTGRES_DB: user
      # 앱(config.LoadConfig)이 읽는 것과 같은 USER_DATABASE_PASSWORD 를 사용해
      # 컨테이너와 앱이 항상 같은 비밀번호를 보도록 한다. Compose 는 프로젝트
      # 루트의 .env 를 자동으로 읽으므로, cp .env.example .env 로 만든 파일이
      # 앱과 이 컨테이너 양쪽에 그대로 적용된다.
      POSTGRES_PASSWORD: ${USER_DATABASE_PASSWORD:?USER_DATABASE_PASSWORD is required — copy .env.example to .env first}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    # 앱이 읽는 것과 같은 USER_REDIS_PASSWORD 를 사용한다.
    command: ["redis-server", "--requirepass", "${USER_REDIS_PASSWORD:?USER_REDIS_PASSWORD is required — copy .env.example to .env first}"]
    ports:
      - "6379:6379"

volumes:
  postgres_data:
